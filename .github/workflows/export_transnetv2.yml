name: Export TransNetV2 ONNX

# Manual, one-off. Exports the proven transnetv2-pytorch model to ONNX with a
# window-level and video-level parity proof against the PyTorch outputs, so the
# render job can run shot detection through onnxruntime without torch.
#
# The artifact is uploaded to the immutable 'golden-masters-v1' release by hand
# and SHA-256 pinned in tools/fetch_models.py. Re-run only if the model or
# preprocessing changes.

on:
  workflow_dispatch:
    inputs:
      max_seconds:
        description: 'Seconds of the golden master used for video-level parity'
        type: string
        default: '15'

permissions:
  contents: read

concurrency:
  group: export-transnetv2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export and prove parity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ml.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ML tier
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Fetch a golden master
        run: |
          curl -sL --retry 3 -o "$RUNNER_TEMP/parity.mp4" \
            "https://github.com/JackPro2121/podcasts-clips-to-social/releases/download/golden-masters-v1/clip_1_WHY_HIGH_INCOME_DOESNT_MEAN_RI.mp4"
          ls -l "$RUNNER_TEMP/parity.mp4"

      - name: Export with parity checks
        run: |
          python tools/export_transnetv2_onnx.py \
            --video "$RUNNER_TEMP/parity.mp4" \
            --max-seconds ${{ github.event.inputs.max_seconds }} \
            --output transnetv2.onnx \
            --manifest transnetv2_onnx_manifest.json

      - name: Upload ONNX artifact
        uses: actions/upload-artifact@v4
        with:
          name: transnetv2-onnx
          path: |
            transnetv2.onnx
            transnetv2_onnx_manifest.json
          retention-days: 90
