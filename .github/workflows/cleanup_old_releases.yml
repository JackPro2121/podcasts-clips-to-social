name: Auto-Cleanup Old Video Releases

on:
  schedule:
    # Run once daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Delete video releases older than N days'
        required: true
        default: '5'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '7'
          - '14'
          - '30'
      dry_run:
        description: 'Simulate cleanup without deleting'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: podcast-release-cleanup
  cancel-in-progress: false

jobs:
  cleanup-releases:
    name: Clean Old Video Releases
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install requests python-dotenv

      - name: Run Release Auto-Cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN || secrets.BUFFER_API_KEY }}
          INPUT_DAYS: ${{ github.event.inputs.days || '5' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          case "$INPUT_DAYS" in
            1|3|5|7|14|30) ;;
            *) echo "Invalid cleanup age: $INPUT_DAYS" >&2; exit 1 ;;
          esac
          args=(--days "$INPUT_DAYS" --release-prefix "clips-")
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python -m src.release_cleaner "${args[@]}"
