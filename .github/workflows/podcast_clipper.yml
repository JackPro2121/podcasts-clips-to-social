name: Podcast Viral Clips to Social (Buffer)

on:
  schedule:
    # Runs daily at 10:00 UTC (06:00 AM EDT / New York).
    # Generates 3 clips and queues them for Buffer slots:
    # 08:30 AM EDT, 01:15 PM EDT, 07:30 PM EDT (US/UK Prime Time).
    - cron: '0 10 * * *'

  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL (Leave blank to auto-discover latest high-CPM podcast)'
        required: false
        default: ''
        type: string
      niche:
        description: 'Target Niche for Auto-Discovery (default: Personal Finance & Wealth)'
        required: false
        default: 'finance'
        type: choice
        options:
          - 'finance'
          - 'business'
          - 'ai_tech'
          - 'health_longevity'
          - 'real_estate'
          - 'mindset'
          - 'auto'
      num_clips:
        description: 'Number of viral clips to extract (1 to 5)'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      framing:
        description: 'Framing Strategy (Auto face tracking, Split-screen, Blur-stack, Crop)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'split'
          - 'blur_stack'
          - 'crop'
      subtitle_style:
        description: 'Subtitle Aesthetic & Color Palette'
        required: true
        default: 'hormozi'
        type: choice
        options:
          - 'hormozi'
          - 'neon_green'
          - 'luxury_gold'
          - 'cyber_cyan'
      subtitles_mode:
        description: 'Subtitle burn-in mode (auto, burn, or skip if already baked-in)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'burn'
          - 'skip'
      post_to_buffer:
        description: 'Automatically schedule generated clips to Buffer connected channels'
        required: true
        default: true
        type: boolean
      watermark:
        description: 'Channel Watermark to burn at 50% opacity'
        required: false
        default: '@allinonepodcastsss'
        type: string

  pull_request:
    paths:
      - '**/*.py'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.ini'
      - 'requirements.txt'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: podcast-clipper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify pipeline contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Run static checks
        run: |
          python -m ruff check --select E4,E7,E9,F main.py src tests render_dynamic_showcase.py
          python -m mypy main.py src
      - name: Scan tracked files for common secret patterns
        run: |
          if git grep -nE '(ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,})' -- .; then
            echo 'Potential secret pattern found in tracked files.'
            exit 1
          fi

  clip-and-publish:
    name: Detect Viral Clips, Enhance & Publish
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Cloudflare WARP (Optional, Linux only)
        if: ${{ runner.os == 'Linux' && vars.ENABLE_WARP == 'true' }}
        uses: fscarmen/warp-on-actions@v1.4
        continue-on-error: true
        timeout-minutes: 3
        with:
          stack: dual
          mode: wireguard

      - name: Verify Network Egress
        run: |
          echo "[*] Runner Outbound IP:"
          curl -s https://api.ipify.org || true
          echo ""
          echo "[*] Network Trace:"
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E "warp|ip|loc" || true

      - name: Start POT Provider Service (bgutil, Linux only)
        if: ${{ runner.os == 'Linux' }}
        run: |
          if command -v docker >/dev/null && docker run --name bgutil-provider -d --net=host --init brainicism/bgutil-ytdlp-pot-provider; then
            for attempt in {1..10}; do
              if curl --fail --silent http://127.0.0.1:4416/ping >/dev/null; then
                echo "YTDLP_POT_PROVIDER_URL=http://127.0.0.1:4416" >> "$GITHUB_ENV"
                echo "[*] POT provider is healthy."
                exit 0
              fi
              sleep 2
            done
          fi
          echo "[!] POT provider unavailable; yt-dlp will use its built-in client fallbacks."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
          elif [ "$RUNNER_OS" = "macOS" ]; then
            if ! command -v ffmpeg &> /dev/null; then
              brew install ffmpeg
            fi
          fi
          ffmpeg -version | head -n 1


      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Podcast Clipper & Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.groq_api_key }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.openrouter_api_key }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma4:31b' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ENABLE_BROLL: ${{ vars.ENABLE_BROLL || 'false' }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN || secrets.BUFFER_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY || secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          CHANNEL_WATERMARK: ${{ secrets.CHANNEL_WATERMARK || '@allinonepodcastsss' }}
          CHOCODATA_API_KEY: ${{ secrets.CHOCODATA_API_KEY }}
          # Expired browser cookies produce repeated yt-dlp failures. Keep this
          # disabled unless USE_YOUTUBE_COOKIES is explicitly set to true after
          # exporting a fresh Netscape-format cookie file.
          YOUTUBE_COOKIES: ${{ vars.USE_YOUTUBE_COOKIES == 'true' && secrets.YOUTUBE_COOKIES || '' }}
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          COBALT_API_URL: ${{ secrets.COBALT_API_URL || 'https://api.cobalt.tools' }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_SEGMENT_ACTOR_ID: ${{ vars.APIFY_SEGMENT_ACTOR_ID || 'vidkraken/youtube-video-audio-downloader-reliable' }}
          APIFY_TRANSCRIPT_ACTOR_ID: ${{ vars.APIFY_TRANSCRIPT_ACTOR_ID || 'om_kh/video-transcript-api' }}
           CLIP_ONLY_MODE: 'true'
           UNIVERSAL_EDITOR_SHADOW: ${{ vars.UNIVERSAL_EDITOR_SHADOW || 'true' }}
           UNIVERSAL_EDITOR_ENFORCE_QA: ${{ vars.UNIVERSAL_EDITOR_ENFORCE_QA || 'false' }}
          MAX_DISCOVERY_CANDIDATES: '12'
          MAX_TRANSCRIPT_FALLBACKS: '3'
          YTDLP_POT_PROVIDER_URL: ${{ env.YTDLP_POT_PROVIDER_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # SECURITY: untrusted workflow_dispatch inputs are passed through the
          # environment (never interpolated into the shell), so a value like
          # `'; rm -rf / #` is just data. No `eval`.
          EVENT_NAME: ${{ github.event_name }}
          IN_VIDEO_URL: ${{ github.event.inputs.video_url }}
          IN_NICHE: ${{ github.event.inputs.niche }}
          IN_NUM_CLIPS: ${{ github.event.inputs.num_clips }}
          IN_FRAMING: ${{ github.event.inputs.framing }}
          IN_SUBTITLE_STYLE: ${{ github.event.inputs.subtitle_style }}
          IN_SUBTITLES_MODE: ${{ github.event.inputs.subtitles_mode }}
          IN_POST_TO_BUFFER: ${{ github.event.inputs.post_to_buffer }}
          IN_WATERMARK: ${{ github.event.inputs.watermark }}
        run: |
          set -euo pipefail
          args=()
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "[*] Triggered by daily schedule! Running automated High-CPM Finance & Wealth discovery..."
            args+=(--niche "finance" --num-clips 3 --framing auto --subtitle-style hormozi --subtitles auto)
            args+=(--watermark "@allinonepodcastsss" --post-to-buffer)
          else
            echo "[*] Triggered manually via workflow_dispatch."
            [ -n "${IN_VIDEO_URL:-}" ] && args+=(--url "$IN_VIDEO_URL")
            args+=(--niche "${IN_NICHE:-finance}")
            args+=(--num-clips "${IN_NUM_CLIPS:-3}")
            args+=(--framing "${IN_FRAMING:-auto}")
            args+=(--subtitle-style "${IN_SUBTITLE_STYLE:-hormozi}")
            args+=(--subtitles "${IN_SUBTITLES_MODE:-auto}")
            args+=(--watermark "${IN_WATERMARK:-@allinonepodcastsss}")
            [ "${IN_POST_TO_BUFFER:-false}" = "true" ] && args+=(--post-to-buffer)
          fi
          python main.py "${args[@]}"

      - name: Persist Processed Video History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(history): update processed podcast episodes [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "History push skipped"
          fi

      - name: Upload Output Clips as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viral-podcast-clips
          path: clips/*.mp4
          retention-days: 14

      - name: Job Summary Report
        if: always()
        env:
          INPUT_VIDEO_URL: ${{ github.event.inputs.video_url }}
          INPUT_NUM_CLIPS: ${{ github.event.inputs.num_clips }}
          INPUT_FRAMING: ${{ github.event.inputs.framing }}
          INPUT_SUBTITLE_STYLE: ${{ github.event.inputs.subtitle_style }}
          INPUT_POST_TO_BUFFER: ${{ github.event.inputs.post_to_buffer }}
        run: |
          {
            echo "## 🎬 Viral Clips Processing Summary"
            printf '%s\n' "- **Source Video:** ${INPUT_VIDEO_URL:-Auto-discovered}"
            printf '%s\n' "- **Clips Requested:** ${INPUT_NUM_CLIPS:-3}"
            printf '%s\n' "- **Framing Strategy:** ${INPUT_FRAMING:-auto}"
            printf '%s\n' "- **Subtitle Theme:** ${INPUT_SUBTITLE_STYLE:-hormozi}"
            printf '%s\n' "- **Posted to Buffer:** ${INPUT_POST_TO_BUFFER:-false}"
            echo "Clips have been archived as release assets and workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
